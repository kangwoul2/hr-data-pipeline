services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: hr_pipeline
      POSTGRES_USER: hr
      POSTGRES_PASSWORD: hr
    ports:
      - "5434:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hr -d hr_pipeline"]
      interval: 5s
      timeout: 3s
      retries: 10
