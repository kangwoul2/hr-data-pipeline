<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="650" viewBox="0 0 1280 650" role="img" aria-labelledby="title desc"><title id="title">HR Data Pipeline Architecture</title><desc id="desc">Raw IBM HR data passes through validation, transformation, transactional PostgreSQL loading, then an analytics API. Airflow orchestrates the pipeline and EXPLAIN ANALYZE is used for query experiments.</desc><rect width="1280" height="650" fill="#fff"/><style>text{font-family:Arial,sans-serif;fill:#111827}.box{fill:#f9fafb;stroke:#374151;stroke-width:2}.q{fill:#fefce8;stroke:#a16207;stroke-width:2}.db{fill:#f0fdf4;stroke:#15803d;stroke-width:2}.api{fill:#eef2ff;stroke:#4f46e5;stroke-width:2}.line{stroke:#6b7280;stroke-width:2;fill:none;marker-end:url(#a)}</style><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#6b7280"/></marker></defs><text x="50" y="48" font-size="26" font-weight="700">HR Data Pipeline</text><text x="50" y="76" font-size="14">From exploratory notebooks to a reproducible, quality-gated data service.</text><rect class="box" x="55" y="165" width="180" height="92" rx="8"/><text x="93" y="199" font-size="17" font-weight="700">Raw HR CSV</text><text x="86" y="228" font-size="13">1,470 employee rows</text><rect class="q" x="295" y="145" width="215" height="132" rx="8"/><text x="342" y="180" font-size="17" font-weight="700">Quality Gate</text><text x="323" y="208" font-size="13">required columns / null</text><text x="323" y="231" font-size="13">duplicate employee ID</text><text x="323" y="254" font-size="13">income / attrition domain</text><rect class="box" x="575" y="135" width="220" height="155" rx="8"/><text x="626" y="171" font-size="17" font-weight="700">Transform</text><text x="606" y="200" font-size="13">employee dimension</text><text x="606" y="223" font-size="13">attrition fact</text><text x="606" y="246" font-size="13">department aggregate</text><text x="606" y="269" font-size="13">deterministic schema</text><rect class="db" x="870" y="145" width="220" height="130" rx="8"/><text x="926" y="180" font-size="17" font-weight="700">PostgreSQL</text><text x="899" y="208" font-size="13">PK / FK / CHECK</text><text x="899" y="231" font-size="13">transactional reload</text><text x="899" y="254" font-size="13">indexes / EXPLAIN</text><rect class="api" x="870" y="390" width="220" height="105" rx="8"/><text x="930" y="425" font-size="17" font-weight="700">FastAPI</text><text x="899" y="452" font-size="13">department analytics API</text><text x="899" y="475" font-size="13">health endpoint</text><rect class="box" x="575" y="390" width="220" height="105" rx="8"/><text x="631" y="425" font-size="17" font-weight="700">Airflow DAG</text><text x="606" y="452" font-size="13">schedule / orchestration</text><text x="606" y="475" font-size="13">pipeline execution boundary</text><line class="line" x1="235" y1="211" x2="295" y2="211"/><line class="line" x1="510" y1="211" x2="575" y2="211"/><line class="line" x1="795" y1="211" x2="870" y2="211"/><line class="line" x1="980" y1="275" x2="980" y2="390"/><line class="line" x1="685" y1="390" x2="685" y2="290"/><text x="55" y="575" font-size="14">Correctness rule: validate before loading, preserve DB constraints during reload, and keep the load in one transaction so partial refreshes do not become visible.</text></svg>