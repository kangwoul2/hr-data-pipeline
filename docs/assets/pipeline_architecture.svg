<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="850" viewBox="0 0 1400 850" role="img" aria-labelledby="title desc">
  <title id="title">HR 데이터 파이프라인의 현재 구현 구조</title>
  <desc id="desc">CLI가 원본 CSV를 읽고 품질 검사와 변환을 실행합니다. 세 테이블은 PostgreSQL의 하나의 적재 트랜잭션으로 갱신되며 FastAPI는 부서 집계를 조회합니다. 노트북 분석은 별도 경로이고 Airflow는 실제 ETL에 연결되지 않은 DAG 뼈대입니다.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#526782"/></marker>
  </defs>
  <style>
    text{font-family:'Malgun Gothic','Noto Sans KR',Arial,sans-serif;fill:#172c48}
    .title{font-size:30px;font-weight:700}.heading{font-size:20px;font-weight:700}
    .body{font-size:16px}.small{font-size:14px}.muted{fill:#50627a}
    .box{fill:#fff;stroke:#b9c9dc;stroke-width:1.5}
    .flow{stroke:#526782;stroke-width:2;fill:none;marker-end:url(#arrow)}
  </style>
  <rect width="1400" height="850" rx="16" fill="#f5f8fc"/>
  <text x="44" y="55" class="title">HR Data Pipeline</text>
  <text x="44" y="85" class="body muted">분석 기록 → 재현 가능한 배치 처리 → 조회 인터페이스</text>
  <rect x="44" y="110" width="1312" height="123" rx="12" fill="#fff6e6" stroke="#d7a950" stroke-dasharray="7 5"/>
  <text x="65" y="143" class="heading">Airflow · 확장 준비 단계</text>
  <text x="65" y="173" class="body">hr_pipeline_dag.py : quality_gate → transform → load / 일정 0 7 * * * / catchup=False</text>
  <text x="65" y="202" class="body">현재 각 태스크는 설명 문자열만 반환합니다. 실제 ETL 호출·재시도 설정·스케줄 실행 검증이 필요합니다.</text>
  <rect x="44" y="259" width="1312" height="76" rx="12" fill="#e6edf9"/>
  <text x="65" y="290" class="heading">실제 배치 진입점: scripts/run_pipeline.py → pipeline.py</text>
  <text x="65" y="316" class="body">파일 읽기·검사·변환 → storage.py로 스키마 준비 → pipeline.py에서 삭제·삽입 트랜잭션 실행</text>
  <rect x="44" y="370" width="215" height="152" rx="12" class="box"/>
  <text x="63" y="404" class="heading">원본 HR CSV</text>
  <text x="63" y="436" class="body">1,470행 / 35열</text>
  <text x="63" y="464" class="body">3개 부서 / 9개 직무</text>
  <text x="63" y="494" class="small muted">pd.read_csv(source)</text>
  <path d="M259 445H289" class="flow"/>
  <rect x="294" y="370" width="250" height="152" rx="12" fill="#fffbea" stroke="#d2b95b"/>
  <text x="312" y="404" class="heading">quality.py</text>
  <text x="312" y="436" class="body">필수 열 · NULL · 중복 ID</text>
  <text x="312" y="464" class="body">음수 급여 · 이직 값 범위</text>
  <text x="312" y="494" class="small muted">실패 시 적재 전에 중단합니다.</text>
  <path d="M544 445H574" class="flow"/>
  <rect x="579" y="370" width="249" height="152" rx="12" class="box"/>
  <text x="597" y="404" class="heading">transform.py</text>
  <text x="597" y="436" class="body">직원 속성 열 변환</text>
  <text x="597" y="464" class="body">이직 Yes / No → 1 / 0</text>
  <text x="597" y="494" class="body">부서별 인원 · 급여 · 이직률</text>
  <path d="M828 445H858" class="flow"/>
  <rect x="863" y="357" width="493" height="178" rx="12" fill="#e9f6ef" stroke="#65a782"/>
  <text x="884" y="391" class="heading">PostgreSQL · 하나의 적재 트랜잭션</text>
  <text x="884" y="423" class="body">hr_employees · 직원 1,470행 / PK</text>
  <text x="884" y="453" class="body">hr_attrition_facts · 이직 정보 1,470행 / PK·FK</text>
  <text x="884" y="483" class="body">hr_department_summary · 부서 집계 3행 / PK</text>
  <text x="884" y="513" class="small muted">기존 행 삭제 + 새 행 삽입 / 실패 시 전체 롤백</text>
  <rect x="44" y="564" width="784" height="155" rx="12" class="box"/>
  <text x="65" y="598" class="heading">별도의 분석·학습 경로</text>
  <text x="65" y="630" class="body">first / department.ipynb → 집계 CSV → strategy / a.ipynb</text>
  <text x="65" y="660" class="body">simul.ipynb : 교체 비율을 가정한 근속연수 분포 실험</text>
  <text x="65" y="692" class="small muted">분석 CSV는 현재 ETL의 입력이 아닙니다. 업무량 CSV 생성 코드는 보완 대상입니다.</text>
  <path d="M1110 535V568" class="flow"/>
  <rect x="863" y="577" width="493" height="142" rx="12" fill="#eceefe" stroke="#969bd7"/>
  <text x="884" y="612" class="heading">api.py · FastAPI → 조회 클라이언트</text>
  <text x="884" y="644" class="body">부서 목록 / 특정 부서 집계를 조회합니다.</text>
  <text x="884" y="674" class="body">GET /health : 고정 응답, DB 상태 검사는 없습니다.</text>
  <text x="884" y="702" class="small muted">조회 원본: hr_department_summary</text>
  <rect x="44" y="750" width="1312" height="68" rx="10" fill="#172c48"/>
  <text x="65" y="778" style="fill:#fff;font-size:16px">검증: 기존 테스트 4개 통과 · 동일 입력 재적재 · 오류 주입 후 롤백 · HTTP API 조회 확인</text>
  <text x="65" y="803" style="fill:#d9e5f5;font-size:14px">추가 통합 검증은 2026-09-17 PostgreSQL 17.11 환경에서 수행했으며, 현재 CI에는 포함되어 있지 않습니다.</text>
</svg>
