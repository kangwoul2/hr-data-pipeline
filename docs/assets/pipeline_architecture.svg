<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="650" viewBox="0 0 1280 650" role="img" aria-labelledby="title desc"><title id="title">HR 데이터 파이프라인 구조</title><desc id="desc">원본 IBM HR 데이터가 품질 검사와 변환을 거쳐 PostgreSQL에 트랜잭션으로 적재되고, Airflow가 실행 순서를 관리하며 FastAPI가 집계 결과를 제공합니다.</desc><rect width="1280" height="650" fill="#fff"/><style>text{font-family:Arial,'Noto Sans KR',sans-serif;fill:#111827}.box{fill:#f9fafb;stroke:#374151;stroke-width:2}.q{fill:#fefce8;stroke:#a16207;stroke-width:2}.db{fill:#f0fdf4;stroke:#15803d;stroke-width:2}.api{fill:#eef2ff;stroke:#4f46e5;stroke-width:2}.line{stroke:#6b7280;stroke-width:2;fill:none;marker-end:url(#a)}</style><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#6b7280"/></marker></defs><text x="50" y="48" font-size="26" font-weight="700">HR 데이터 파이프라인</text><text x="50" y="76" font-size="14">분석 노트북을 반복 가능하고 검증 가능한 데이터 처리 구조로 확장했습니다.</text><rect class="box" x="55" y="165" width="180" height="92" rx="8"/><text x="93" y="199" font-size="17" font-weight="700">원본 HR CSV</text><text x="86" y="228" font-size="13">직원 1,470행</text><rect class="q" x="295" y="145" width="215" height="132" rx="8"/><text x="342" y="180" font-size="17" font-weight="700">데이터 품질 검사</text><text x="323" y="208" font-size="13">필수 열 / 누락값</text><text x="323" y="231" font-size="13">직원 ID 중복</text><text x="323" y="254" font-size="13">급여 / 이직 여부 값 검사</text><rect class="box" x="575" y="135" width="220" height="155" rx="8"/><text x="626" y="171" font-size="17" font-weight="700">데이터 변환</text><text x="606" y="200" font-size="13">직원 차원 테이블</text><text x="606" y="223" font-size="13">이직 사실 테이블</text><text x="606" y="246" font-size="13">부서별 집계</text><text x="606" y="269" font-size="13">고정된 데이터 구조</text><rect class="db" x="870" y="145" width="220" height="130" rx="8"/><text x="926" y="180" font-size="17" font-weight="700">PostgreSQL</text><text x="899" y="208" font-size="13">PK / FK / CHECK</text><text x="899" y="231" font-size="13">트랜잭션 재적재</text><text x="899" y="254" font-size="13">인덱스 / EXPLAIN</text><rect class="api" x="870" y="390" width="220" height="105" rx="8"/><text x="930" y="425" font-size="17" font-weight="700">FastAPI</text><text x="899" y="452" font-size="13">부서별 분석 조회 API</text><text x="899" y="475" font-size="13">상태 확인 API</text><rect class="box" x="575" y="390" width="220" height="105" rx="8"/><text x="631" y="425" font-size="17" font-weight="700">Airflow DAG</text><text x="606" y="452" font-size="13">실행 일정 / 작업 순서</text><text x="606" y="475" font-size="13">성공·실패 상태 관리</text><line class="line" x1="235" y1="211" x2="295" y2="211"/><line class="line" x1="510" y1="211" x2="575" y2="211"/><line class="line" x1="795" y1="211" x2="870" y2="211"/><line class="line" x1="980" y1="275" x2="980" y2="390"/><line class="line" x1="685" y1="390" x2="685" y2="290"/><text x="55" y="575" font-size="14">원칙: 적재 전에 데이터를 검사하고, DB 제약조건을 유지하며, 하나의 트랜잭션으로 부분 적재 상태를 막습니다.</text></svg>